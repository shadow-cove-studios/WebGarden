name: Deploy Pygame to GitHub Pages

on:
  push:
    branches:
      - main  # Triggers the automation every time you push to the 'main' branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pygbag
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pygbag

      - name: Compile Pygame to WebAssembly
        run: |
          # Pygbag compiles the root directory "." and outputs to build/web
          pygbag --build .

      - name: Upload Web Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web # Tells GitHub to upload only the web-ready output folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4