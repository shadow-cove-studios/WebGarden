<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- [ Display Info ] Set title and icon-->
    <title> Web Garden </title>
    <link rel="icon" type="image/png" sizes="80x80" href="favicon.png">

    <!-- [ PyScript ] Load styles and bootstrap modules -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.2.1/core.js"></script>

    <!-- Style -->
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            background-image: url("assets/ground-1.png");
            background-repeat: repeat;
            background-size: 64px 64px;
            image-rendering: pixelated;
        }

        .border-1, .border-2, .border-3, .border-4, .border-5 {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
        }

        .border-1 { border: 5px solid #a08662; }
        .border-2 { border: 5px solid #c7b08b; }
        .border-3 { border: 5px solid #e4d2aa; }
        .border-4 { border: 5px solid #c7b08b; }
        .border-5 { border: 5px solid #a08662; }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- These div's are here to draw the border of the website for aesthetic -->
    <div class="border-1">
        <div class="border-2">
            <div class="border-3">
                <div class="border-4">
                    <div class="border-5">
                        <!-- [ PyGame ] PyGame will target this canvas tag automatically -->
                        <canvas id="canvas"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- [ PyGame ] This code calls the async game script (main.py) as type "py-game" to initialize it. -->
    <script type="py-game" src="main.py"></script>

    <!-- [ Force title post load ] -- Pygame overwrites it so this code fixes it after pygame does so. -->
    <script>
        // Observe if document title suddently doesnt match "Web Garden"
        const titleObserver = new MutationObserver(() => {
            if (document.title !== "Web Garden") {
                document.title = "Web Garden";
            }
        });

        // If title doesnt match "Web Garden" do the following:

        // 1) Query the title
        titleObserver.observe(
            document.querySelector("title"),
            { childList: true }
        );

        // 2) Change the title to "Web Garden"
        document.title = "Web Garden";
    </script>
</body>
</html>
