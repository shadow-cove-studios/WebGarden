<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pygame in Browser</title>
    <!-- PyScript styles and bootstrap modules -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.2.1/core.js"></script>
</head>
<body>
    <h1>My Web Pygame</h1>
    <!-- Pygame will target this canvas tag automatically -->
    <canvas id="canvas"></canvas> 
    
    <!-- Link your async python game script here -->
    <script type="py-game" src="main.py"></script>
</body>
</html>
